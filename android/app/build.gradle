plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omachy.connect'
    compileSdk 36

    defaultConfig {
        applicationId 'com.omachy.connect'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Self-contained QR/code scanning (bundles camera + decoder; no Google Play Services needed).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
}
